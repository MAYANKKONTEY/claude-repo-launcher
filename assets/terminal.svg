<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="Example session: an existing repo is unreachable, so the skill creates a new repo and pushes the work there">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0" r="0.7">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .ln{animation:in .5s ease-out both}
      @keyframes in{from{opacity:0}to{opacity:1}}
      .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}.d4{animation-delay:1.7s}
      .d5{animation-delay:2.2s}.d6{animation-delay:2.7s}.d7{animation-delay:3.2s}.d8{animation-delay:3.7s}
      .d9{animation-delay:4.2s}.d10{animation-delay:4.7s}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .k{fill:#C9C2E6}.m{fill:#7D739F}.p{fill:#A78BFA}.o{fill:#FB923C}.w{fill:#FFFFFF}.ol{fill:#FED7AA}
    </style>
  </defs>

  <rect width="1280" height="500" rx="20" fill="#0C0816"/>
  <rect width="1280" height="500" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="499" rx="20" fill="none" stroke="url(#edge)"/>
  <path d="M0 48 H1280" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <circle cx="28" cy="24" r="6.5" fill="#FB923C"/>
  <circle cx="50" cy="24" r="6.5" fill="#A78BFA"/>
  <circle cx="72" cy="24" r="6.5" fill="#FFFFFF" fill-opacity="0.75"/>
  <text x="640" y="29" text-anchor="middle" class="mono" font-size="13" fill="#7D739F">claude — repo-launcher · self-healing run</text>

  <g class="mono" font-size="16">
    <text class="ln d1" x="40" y="96"><tspan class="o">you ›</tspan><tspan x="120" class="w">push my notes app to my repo "study-notes"</tspan></text>

    <text class="ln d2" x="40" y="140"><tspan class="p">claude ›</tspan><tspan x="140" class="m">checking access…</tspan></text>
    <text class="ln d3" x="140" y="172"><tspan class="o">✗</tspan><tspan x="168" class="k">add_repo study-notes</tspan><tspan x="520" class="m">403 · not authorized</tspan></text>
    <text class="ln d4" x="140" y="202"><tspan class="o">✗</tspan><tspan x="168" class="k">git clone (retry)</tspan><tspan x="520" class="m">repository not found</tspan></text>
    <text class="ln d5" x="140" y="240"><tspan class="o">↻</tspan><tspan x="168" class="ol">self-healing fallback</tspan><tspan x="520" class="m">original stays untouched</tspan></text>
    <text class="ln d6" x="140" y="272"><tspan class="p">✓</tspan><tspan x="168" class="k">github.com/new</tspan><tspan x="520" class="w">study-notes-v2</tspan><tspan class="m" dx="10">· private</tspan></text>
    <text class="ln d7" x="140" y="302"><tspan class="p">✓</tspan><tspan x="168" class="k">copy local work</tspan><tspan x="520" class="m">42 files · history kept</tspan></text>
    <text class="ln d8" x="140" y="332"><tspan class="p">✓</tspan><tspan x="168" class="k">README trail</tspan><tspan x="520" class="m">"rescued from study-notes"</tspan></text>
    <text class="ln d9" x="140" y="362"><tspan class="p">✓</tspan><tspan x="168" class="k">git push</tspan><tspan x="520" class="m">main → main</tspan></text>

    <text class="ln d10" x="40" y="414"><tspan class="p">claude ›</tspan><tspan x="140" class="w">Done.</tspan><tspan class="m" dx="10">study-notes was unreachable, so your work is in</tspan></text>
    <text class="ln d10" x="140" y="444"><tspan class="ol">github.com/you/study-notes-v2</tspan><tspan class="m" dx="10">· nothing lost.</tspan></text>
    <rect class="blink" x="548" y="430" width="10" height="19" rx="1" fill="#FB923C"/>
  </g>
</svg>
